    let currentQuestionIndex = 0;
    let score = 0;
    let shuffledQuestions = [];
    let currentShuffledOptions = [];
    let answered = false;

    // Shuffle Array Utility
    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = [...array];
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function initQuiz() {
      shuffledQuestions = shuffle(questions);
      currentQuestionIndex = 0;
      score = 0;
      document.getElementById('results-container').classList.add('hidden');
      document.getElementById('quiz-container').classList.remove('hidden');
      updateStats();
      loadQuestion();
    }

    function updateStats() {
      document.getElementById('current-q').innerText = currentQuestionIndex + 1;
      document.getElementById('score').innerText = score;
      document.getElementById('question-number-badge').innerText = `Pytanie ${currentQuestionIndex + 1} z ${shuffledQuestions.length}`;
      const progressPercent = ((currentQuestionIndex) / shuffledQuestions.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
    }

    function loadQuestion() {
      answered = false;
      const q = shuffledQuestions[currentQuestionIndex];
      
      document.getElementById('question-text').innerText = q.question;
      document.getElementById('explanation-box').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');

      // Create shuffled options mapping
      const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
      currentShuffledOptions = shuffle(optionsWithIndex);

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      currentShuffledOptions.forEach((optionObj, displayIndex) => {
        const btn = document.createElement('button');
        btn.className = "option-btn w-full text-left p-4 rounded-xl bg-slate-700/60 hover:bg-slate-700 border border-slate-600/80 text-slate-200 font-medium text-sm md:text-base flex items-center justify-between";
        btn.innerHTML = `<span>${optionObj.text}</span> <span class="text-xs bg-slate-800 border border-slate-600 px-2 py-1 rounded text-slate-400">${String.fromCharCode(65 + displayIndex)}</span>`;
        btn.onclick = () => selectOption(displayIndex, optionObj.originalIndex);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, originalIndex) {
      if (answered) return;
      answered = true;

      const q = shuffledQuestions[currentQuestionIndex];
      const isCorrect = (originalIndex === q.correct);
      const optionButtons = document.querySelectorAll('.option-btn');

      if (isCorrect) {
        score++;
        document.getElementById('score').innerText = score;
      }

      // Highlight options
      currentShuffledOptions.forEach((opt, idx) => {
        const btn = optionButtons[idx];
        btn.disabled = true;
        btn.classList.remove('hover:bg-slate-700');

        if (opt.originalIndex === q.correct) {
          btn.classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-200');
          btn.innerHTML += ' <span class="text-emerald-400 text-lg">✓</span>';
        } else if (idx === selectedIndex && !isCorrect) {
          btn.classList.add('bg-rose-950', 'border-rose-500', 'text-rose-200');
          btn.innerHTML += ' <span class="text-rose-400 text-lg">✗</span>';
        } else {
          btn.classList.add('opacity-50');
        }
      });

      // Show Explanation
      const expBox = document.getElementById('explanation-box');
      const expStatus = document.getElementById('explanation-status');
      const expText = document.getElementById('explanation-text');

      expBox.classList.remove('hidden');
      if (isCorrect) {
        expBox.className = "p-4 rounded-xl border mb-6 bg-emerald-950/40 border-emerald-600/50";
        expStatus.className = "font-bold text-emerald-400 mb-1 flex items-center gap-2";
        expStatus.innerHTML = "<span>Poprawna odpowiedź!</span>";
      } else {
        expBox.className = "p-4 rounded-xl border mb-6 bg-rose-950/40 border-rose-600/50";
        expStatus.className = "font-bold text-rose-400 mb-1 flex items-center gap-2";
        expStatus.innerHTML = "<span>Niepoprawna odpowiedź</span>";
      }

      expText.innerText = q.explanation;
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < shuffledQuestions.length) {
        updateStats();
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-container').classList.add('hidden');
      document.getElementById('results-container').classList.remove('hidden');
      document.getElementById('progress-bar').style.width = '100%';
      
      document.getElementById('final-score').innerText = score;
      const percentage = Math.round((score / shuffledQuestions.length) * 100);
      document.getElementById('final-percentage').innerText = `Wynik procentowy: ${percentage}%`;
    }

    function restartQuiz() {
      initQuiz();
    }

    // Start on load
    window.onload = initQuiz;
